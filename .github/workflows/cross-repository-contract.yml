name: Cross-repository Social AV contract smoke
on:
  pull_request:
    paths:
      - "social_core/**"
      - "integration_tests/**"
      - ".github/workflows/cross-repository-contract.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Assert private AV repository access is configured
        env:
          AV_REPO_READ_TOKEN: ${{ secrets.AV_REPO_READ_TOKEN }}
        run: |
          if [ -z "$AV_REPO_READ_TOKEN" ]; then
            echo "::error::AV_REPO_READ_TOKEN missing: configure a fine-grained read-only token for private agente-youtube in Redes-Sociais Actions secrets. Cross-repository CI is NOT VERIFIED."
            exit 1
          fi
      - name: Checkout AV counterpart candidate
        uses: actions/checkout@v4
        with:
          repository: luisfabricioviana-dev/agente-youtube
          token: ${{ secrets.AV_REPO_READ_TOKEN }}
          ref: feature/social-av-exchange-v1
          path: _audiovisual
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-repository smoke (no runtime)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests:${{ github.workspace }}/_audiovisual
        run: python -m unittest discover -s integration_tests -p 'test_*.py' -v
