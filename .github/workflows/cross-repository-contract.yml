name: Cross-repository Social AV contract smoke
on:
  pull_request:
    paths:
      - "social_core/**"
      - "integration_tests/**"
      - ".github/workflows/cross-repository-contract.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AV counterpart candidate
        uses: actions/checkout@v4
        with:
          repository: luisfabricioviana-dev/agente-youtube
          ref: feature/social-av-exchange-v1
          path: _audiovisual
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-repository smoke (no runtime)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests:${{ github.workspace }}/_audiovisual
        run: python -m unittest discover -s integration_tests -p 'test_*.py' -v
