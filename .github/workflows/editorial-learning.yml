name: Editorial learning core
on:
  pull_request:
    paths:
      - "social_core/**"
      - "tests/**"
      - "contracts/SOCIAL_AV_EXCHANGE_v1.md"
      - ".github/workflows/editorial-learning.yml"
  push:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run editorial contract regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
