name: REA domain learning regression
on:
  pull_request:
    paths:
      - 'contracts/rea_learning_gate.py'
      - 'tests/test_rea_learning_gate.py'
      - '.github/workflows/rea-learning.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/rea_learning_gate.py'
      - 'tests/test_rea_learning_gate.py'
      - '.github/workflows/rea-learning.yml'
permissions:
  contents: read
jobs:
  rea-domain-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run candidate gate regression
        run: |
          python -m py_compile contracts/rea_learning_gate.py tests/test_rea_learning_gate.py
          python -m unittest discover -s tests -p 'test_rea_learning_gate.py' -v
