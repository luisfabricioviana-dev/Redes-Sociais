name: REA editorial learning bridge
on:
  pull_request:
    paths:
      - "contracts/rea_editorial_bridge.py"
      - "contracts/rea_independent_review.py"
      - "contracts/rea_review_artifacts.py"
      - "contracts/rea_learning_gate.py"
      - "tests/test_rea_editorial_bridge.py"
      - "tests/test_rea_independent_review.py"
      - "tests/test_rea_review_artifacts.py"
      - "tests/test_rea_verification_runner.py"
      - "scripts/verify_rea_editorial_bridge.py"
      - ".github/workflows/rea-editorial-bridge.yml"
  push:
    branches: [main]
jobs:
  contract-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the checked-out commit before executing test code
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/verify_rea_editorial_bridge.py \
            --repo . --out "$RUNNER_TEMP/rea-editorial-verification.json"
      - name: Preserve exact-commit local receipt for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-editorial-verification
          path: ${{ runner.temp }}/rea-editorial-verification.json
          if-no-files-found: warn
          retention-days: 14
